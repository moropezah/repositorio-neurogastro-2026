<style>
:root{
  --bg:#F4F2EF; --surface:#FFFFFF; --surface2:#F9F7F5; --ink:#1E1A1D; --muted:#675F66; --line:#E3DDD8;
  --accent:#1d4a4f; --accent-ink:#FFFFFF; --accent-soft:#e3f0ee;
  --ba:#8a6414; --ci:#1d4a4f; --et:#3d6b2a; --ot:#9e2b25;
  --ok:#1D7A4E; --ok-soft:#E3F2EA; --bad:#B0281E; --bad-soft:#FBE7E4; --warn:#9A5B00; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(40,20,30,.06),0 4px 16px rgba(40,20,30,.05);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151214; --surface:#1F1B1E; --surface2:#262126; --ink:#EEE8EB; --muted:#A79CA4; --line:#372F35;
    --accent:#7fcfc8; --accent-ink:#0f1720; --accent-soft:#173130;
    --ba:#d9b25c; --ci:#7fcfc8; --et:#9ccc7a; --ot:#e88a84;
    --ok:#62C792; --ok-soft:#173226; --bad:#F2887D; --bad-soft:#3A1C1A; --warn:#E6B45F; --warn-soft:#352812;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151214; --surface:#1F1B1E; --surface2:#262126; --ink:#EEE8EB; --muted:#A79CA4; --line:#372F35;
  --accent:#7fcfc8; --accent-ink:#0f1720; --accent-soft:#173130;
  --ba:#d9b25c; --ci:#7fcfc8; --et:#9ccc7a; --ot:#e88a84;
  --ok:#62C792; --ok-soft:#173226; --bad:#F2887D; --bad-soft:#3A1C1A; --warn:#E6B45F; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.04em}
.tabs{max-width:980px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--sans);padding:8px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:18px 0 14px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font:500 13px var(--sans);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
select{font:500 13px var(--sans);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.qcard{padding:22px 22px 18px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chip{font:600 11px var(--mono);letter-spacing:.04em;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface2)}
.chip.b-ES{color:var(--ba);border-color:currentColor;background:transparent}
.chip.b-GD{color:var(--ci);border-color:currentColor;background:transparent}
.chip.b-IN{color:var(--et);border-color:currentColor;background:transparent}
.chip.b-AR{color:var(--ot);border-color:currentColor;background:transparent}
.cloudcfg{display:grid;gap:8px;margin-top:6px}.cloudcfg input{font:13px var(--mono);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.tema-l a{color:var(--accent)}
.chip.lv-S{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.fix{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.new{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.counter{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.stem{font-family:var(--serif);font-size:18.5px;line-height:1.5;margin:0 0 16px;max-width:68ch;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:15px/1.45 var(--sans);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{flex:0 0 26px;height:26px;border-radius:6px;display:grid;place-items:center;font:600 13px var(--mono);background:var(--surface2);border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{font:600 14px var(--sans);padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}
.spacer{flex:1}

.explain{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:14px}
.verdict{font:700 15px var(--sans)}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.blk h4{margin:0 0 6px;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.blk p,.blk li{margin:0;max-width:72ch}
.blk ul{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.blk li b.L{font-family:var(--mono);margin-right:6px}
.mech{background:var(--surface2);border-left:3px solid var(--ci);padding:12px 14px;border-radius:0 8px 8px 0}
.pearl{background:var(--accent-soft);padding:12px 14px;border-radius:8px}
.fixbox{background:var(--warn-soft);padding:10px 14px;border-radius:8px;color:var(--ink)}
.newbox{background:var(--ok-soft);padding:10px 14px;border-radius:8px}
.refs{font-size:13px;color:var(--muted)}

.palette{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px}
.palette button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 11px var(--mono);color:var(--muted);cursor:pointer}
.palette button.cur{border-color:var(--accent);color:var(--ink);font-weight:700}
.palette button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.palette button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.palette button.ans{background:var(--accent-soft)}

.setup{padding:22px;display:grid;gap:16px}
.setup h2,.panel h2{font-family:var(--serif);font-size:22px;margin:0;text-wrap:balance}
.setup p{margin:0;color:var(--muted);max-width:68ch}
.timer{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.progressbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 14px}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.score{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;padding:22px}
.score .big{font:700 52px/1 var(--serif);font-variant-numeric:tabular-nums}
.score .sub{color:var(--muted)}
.bars{display:grid;gap:8px;padding:0 22px 22px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px;margin-top:16px}
details.rv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
details.rv summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
.mark{font:700 13px var(--mono);flex:0 0 auto}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)} .mark.na{color:var(--muted)}
.rvq{font-size:14px}

.flash{perspective:1400px;margin-top:6px}
.fc{position:relative;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;padding:24px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.fc .back{transform:rotateY(180deg)}
.fc .face .hint{margin-top:auto;font-size:12px;color:var(--muted)}
.fc .ans{font-family:var(--serif);font-size:19px;font-weight:600}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.progressbar i{transition:none}}

.panel{padding:22px;display:grid;gap:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.id{font-family:var(--mono);white-space:nowrap}
.gloss{columns:2 260px;column-gap:28px;font-size:14px}
.gloss div{break-inside:avoid;padding:3px 0}
.gloss b{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

#printArea{display:none}
textarea.dump{width:100%;min-height:180px;font:12px var(--mono);background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.expgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.expgrid .card{padding:16px;display:grid;gap:8px;align-content:start}
.expgrid h3{margin:0;font:600 15px var(--sans)}
.expgrid p{margin:0;font-size:13px;color:var(--muted)}
@media print{
  body.printing header.top, body.printing main{display:none!important}
  body.printing #printArea{display:block!important;color:#000;background:#fff;font:11pt/1.4 Georgia,serif}
  #printArea .pq{break-inside:avoid;border-bottom:1px solid #999;padding:8pt 0}
  #printArea .pq h4{font:600 9pt Arial,sans-serif;margin:0 0 4pt;color:#444}
  #printArea .pq p{margin:3pt 0}
  #printArea .pb{break-before:page}
}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:10px;white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.err{color:var(--warn)}
@media (max-width:560px){.brand small{display:none}.top .row{padding-top:8px}#themeBtn{padding:6px 10px;font-size:13px}.qcard{padding:16px}.stem{font-size:17px}.bar{grid-template-columns:110px 1fr 48px}.score .big{font-size:42px}}
</style>

<header class="top">
  <div class="row">
    <div class="brand">Quiz Neurogastro <small>2026 · 128 casos · 16 bloques</small></div>
    <span class="spacer"></span>
    <span id="syncState" class="sync" title="Estado de guardado">● local</span>
    <button class="btn ghost" id="themeBtn" type="button" aria-label="Cambiar tema">◐ Tema</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="study" aria-selected="true">Estudio <span class="badge" id="nStudy"></span></button>
    <button role="tab" data-tab="exam" aria-selected="false">Examen <span class="badge" id="nExam"></span></button>
    <button role="tab" data-tab="flash" aria-selected="false">Flashcards</button>
    <button role="tab" data-tab="stats" aria-selected="false">Progreso</button>
    <button role="tab" data-tab="changes" aria-selected="false">Temario</button>
    <button role="tab" data-tab="gloss" aria-selected="false">Siglas</button>
    <button role="tab" data-tab="export" aria-selected="false">Exportar</button>
  </nav>
</header>

<main class="wrap">
  <section id="tab-study"></section>
  <section id="tab-exam" hidden></section>
  <section id="tab-flash" hidden></section>
  <section id="tab-stats" hidden></section>
  <section id="tab-changes" hidden></section>

</main>

<script>
// Bloques 1–6 · Roma V · ERGE · TICI esofágicos · Eructos y rumiación · Disfagia y EoE · Chicago 4.0
const Q1 = [
/* ===================== Bloque 1 · Roma V y TICI ===================== */
{id:"RV01",b:"ES",t:"Roma V y TICI",n:"R",md:"E",
q:"Mujer de 29 años con dolor abdominal 5 días al mes, que mejora al defecar y se asocia a deposiciones blandas, desde hace 10 semanas tras una gastroenteritis. Sin banderas rojas; hemograma, PCR, anti-transglutaminasa y calprotectina normales. ¿Qué corresponde según Roma V?",
o:["Esperar a completar 6 meses de síntomas antes de diagnosticar SII","Diagnosticar SII-D postinfeccioso con criterios clínicos e iniciar tratamiento","Colonoscopía para descartar enfermedad inflamatoria antes de rotular","Test de aire espirado con lactulosa para descartar SIBO"],
c:1,
e:"Roma V separa <b>criterios clínicos</b> (síntomas molestos, ~8 semanas, sin exigir 6 meses) de criterios de investigación. Con estudio mínimo normal y sin alarma, el diagnóstico es <b>positivo</b> y se trata.",
w:{0:"Los 6 meses de antigüedad quedan para investigación.",2:"Con calprotectina normal y sin alarma, la colonoscopía no está indicada.",3:"Roma V no recomienda test de aire espirado de rutina en el SII."},
p:"Uno de cada cuatro encuestados en el estudio global de la Fundación Roma tenía síntomas que no alcanzaban los criterios, con peor calidad de vida que los asintomáticos: de ahí los criterios clínicos.",
r:"Roma V, Gastroenterology 2026 · Sperber, Gastroenterology 2021 (estudio epidemiológico global)"},

{id:"RV02",b:"ES",t:"Roma V y TICI",n:"R",md:"X",
q:"¿Cuál de estos diagnósticos es NUEVO para el adulto en Roma V?",
o:["Síndrome de vómitos cíclicos","Migraña abdominal","Proctalgia fugaz","Globo"],
c:1,
e:"Roma V incorpora en el adulto la <b>migraña abdominal</b>, la <b>incapacidad para eructar (R-CPD)</b> y los <b>trastornos sensoriales rectales</b> (hipo e hipersensibilidad).",
w:{0:"Los vómitos cíclicos ya estaban en Roma IV.",2:"La proctalgia fugaz ya existía.",3:"El globo es un trastorno esofágico clásico."},
p:"Roma V también reemplaza «trastorno gastrointestinal funcional» por trastorno de la interacción cerebro-intestino y retira «funcional» de casi todos los nombres.",
r:"Roma V, Gastroenterology 2026"},

{id:"RV03",b:"ES",t:"Roma V y TICI",n:"F",md:"E",
q:"Paciente con SII-D moderado le dice: «otro médico me dijo que no tengo nada, que es estrés». ¿Qué intervención tiene evidencia de mejorar por sí misma los resultados?",
o:["Repetir la colonoscopía para tranquilizarlo","Explicar el modelo cerebro-intestino, validar el síntoma y acordar metas y seguimiento","Derivar a psiquiatría como primer paso","Indicar dieta sin gluten empírica"],
c:1,
e:"La <b>relación médico-paciente</b> (explicación positiva del diagnóstico, validación y metas compartidas) es el primer tratamiento en Roma V y mejora satisfacción, adherencia y síntomas.",
w:{0:"Los estudios repetidos refuerzan la idea de enfermedad oculta y no tranquilizan.",2:"La derivación sin explicación refuerza el mensaje de «es psicológico».",3:"La dieta sin gluten sin celíaca no es la primera intervención."},
p:"Evitar «funcional» y «psicosomático» frente al paciente: transmiten que no hay nada real.",
r:"Roma V, Gastroenterology 2026 · Drossman, Gastroenterology 2021 (comunicación)"},

{id:"RV04",b:"ES",t:"Roma V y TICI",n:"R",md:"X",
q:"Hombre de 58 años con dolor abdominal y alternancia del hábito de 3 meses, sin estudios previos. ¿Cuál es el hallazgo que obliga a estudiar antes de rotular un TICI?",
o:["Dolor que mejora al defecar","Inicio de síntomas después de los 50 años","Distensión que aumenta en el día","Sensación de evacuación incompleta"],
c:1,
e:"El <b>inicio a partir de los 45–50 años</b> es bandera roja: colonoscopía antes de diagnosticar SII.",
w:{0:"La mejoría con la defecación es un criterio de SII.",2:"La distensión vespertina es típica de TICI.",3:"La evacuación incompleta es frecuente en TICI y disinergia."},
p:"Otras banderas: sangrado, anemia, baja de peso, síntomas nocturnos que despiertan, fiebre, masa y antecedente familiar de cáncer colorrectal, EII o celíaca.",
r:"Roma V, Gastroenterology 2026 · ACG 2021 SII"},

{id:"RV05",b:"ES",t:"Roma V y TICI",n:"F",md:"E",
q:"¿Qué terapia psicológica tiene evidencia en SII aunque el paciente no tenga ansiedad ni depresión?",
o:["Psicoanálisis","Hipnoterapia dirigida al intestino","Terapia de grupo de apoyo no estructurada","Mindfulness sin componente intestinal como única opción"],
c:1,
e:"La <b>hipnoterapia dirigida al intestino</b> y la <b>TCC</b> reducen síntomas del SII con efecto sostenido meses después; se indican por los síntomas digestivos.",
w:{0:"Sin evidencia en SII.",2:"Sin evidencia de eficacia sobre síntomas.",3:"Tiene datos menores; no reemplaza a TCC o hipnoterapia."},
p:"Existen formatos digitales y grupales que reducen la barrera de acceso.",
r:"Roma V 2026 · ACG 2021 SII"},

{id:"RV06",b:"ES",t:"Roma V y TICI",n:"S",md:"X",
q:"Según el perfil clínico multidimensional de Roma, ¿qué dimensión decide principalmente la intensidad del tratamiento?",
o:["El subtipo de Bristol","El impacto en la vida diaria y los modificadores psicosociales","La edad del paciente","El número de estudios negativos previos"],
c:1,
e:"Además del diagnóstico, el perfil registra modificadores clínicos, <b>impacto</b>, <b>modificadores psicosociales</b> y biomarcadores. Impacto y comorbilidad psicológica deciden neuromoduladores y terapia cerebro-intestino.",
w:{0:"El subtipo orienta el fármaco, no la intensidad.",2:"La edad influye en la búsqueda de organicidad.",3:"Más estudios negativos no cambian la intensidad."},
p:"Anotar en cada paciente: cuánto molesta, qué lo modula y qué comorbilidad psicológica hay.",
r:"Roma V 2026 · Drossman, Rome Foundation MDCP (4.ª ed.)"},

{id:"RV07",b:"ES",t:"Roma V y TICI",n:"R",md:"E",
q:"¿Cuál es la proporción aproximada de la población que cumple criterios de al menos un TICI en el estudio global de la Fundación Roma?",
o:["~10 %","~25 %","~40 %","~65 %"],
c:2,
e:"El estudio global (más de 54.000 personas en 26 países) mostró <b>~41 %</b> con al menos un TICI.",
w:{0:"Subestima la prevalencia.",1:"Corresponde aproximadamente a quienes tienen síntomas sin alcanzar criterios.",3:"Sobreestima."},
p:"Más de un tercio tiene superposición de TICI de distintas regiones y cada uno suma carga.",
r:"Sperber AD et al. Gastroenterology 2021;160:99-114"},

{id:"RV08",b:"ES",t:"Roma V y TICI",n:"F",md:"X",
q:"Paciente con colitis ulcerosa en remisión endoscópica y calprotectina de 40 µg/g, con dolor y diarrea que mejoran al defecar. ¿Conducta?",
o:["Escalar el biológico","Tratar como síntomas tipo SII en EII en remisión","Repetir colonoscopía","Agregar corticoides"],
c:1,
e:"Con remisión objetiva, los síntomas cumplen el patrón de <b>SII superpuesto</b>: se tratan como TICI (dieta, antiespasmódico, loperamida, neuromodulador).",
w:{0:"Escalar inmunosupresión sin inflamación no mejora y expone a riesgos.",2:"La calprotectina y la endoscopía recientes ya documentan remisión.",3:"Los corticoides no corresponden sin actividad."},
p:"Un TICI puede coexistir con enfermedad orgánica y se trata igual; descartar antes malabsorción de ácidos biliares si hubo resección ileal.",
r:"Roma V 2026 · ECCO 2022"},

/* ===================== Bloque 2 · ERGE y Lyon 2.0 ===================== */
{id:"RG01",b:"ES",t:"ERGE y Lyon 2.0",n:"R",md:"E",
q:"¿Cuál de estos hallazgos endoscópicos es evidencia CONCLUYENTE de ERGE según Lyon 2.0?",
o:["Esofagitis LA A","Esofagitis LA B","Hernia hiatal de 2 cm","Unión escamocolumnar irregular sin biopsia"],
c:1,
e:"Lyon 2.0 considera concluyentes <b>LA B, C y D</b>, Barrett con biopsia y estenosis péptica. LA A pasó a no concluyente.",
w:{0:"LA A se ve en sanos y no es concluyente.",2:"La hernia hiatal es solo evidencia adyuvante.",3:"Sin biopsia no hay diagnóstico de Barrett."},
p:"La endoscopía para diagnosticar ERGE se hace tras 2–4 semanas sin IBP: con 8 semanas de tratamiento cicatriza ~80 % de las esofagitis.",
r:"Gyawali CP et al. Gut 2024;73:361-71"},

{id:"RG02",b:"ES",t:"ERGE y Lyon 2.0",n:"R",md:"X",
q:"pH-impedancia sin tratamiento: TEA 5,2 %, 92 reflujos, MNBI 1.300 Ω. ¿Interpretación?",
o:["Normal","Zona gris que los adyuvantes inclinan a ERGE","ERGE concluyente","Hipersensibilidad al reflujo"],
c:1,
e:"TEA 4–6 % es zona gris; <b>&gt; 80 reflujos</b> y <b>MNBI &lt; 1.500 Ω</b> son adyuvantes a favor.",
w:{0:"TEA &gt; 4 % no es normal.",2:"Concluyente requiere TEA &gt; 6 % o endoscopía LA B–D, Barrett o estenosis.",3:"La hipersensibilidad exige TEA normal."},
p:"Si la decisión es quirúrgica, repetir con registro prolongado (cápsula 96 h).",
r:"Lyon 2.0, Gut 2024"},

{id:"RG03",b:"ES",t:"ERGE y Lyon 2.0",n:"F",md:"E",
q:"¿Qué métrica de pH-impedancia fue retirada en Lyon 2.0?",
o:["MNBI","Número de reflujos","Índice PSPW","TEA"],
c:2,
e:"El <b>PSPW</b> (onda peristáltica inducida por deglución posreflujo) quedó como herramienta de investigación.",
w:{0:"La MNBI se mantiene como adyuvante.",1:"El número de reflujos se mantiene (&lt; 40 en contra, &gt; 80 a favor).",3:"El TEA es la métrica principal."},
p:"Lyon 2.0 agregó hernia hiatal e histología como adyuvantes.",
r:"Lyon 2.0, Gut 2024"},

{id:"RG04",b:"ES",t:"ERGE y Lyon 2.0",n:"F",md:"X",
q:"Hombre con esofagitis LA C documentada, persiste con pirosis pese a esomeprazol 40 mg c/12 h bien tomado. pH-impedancia con IBP: TEA 5,8 %, 104 reflujos. ¿Qué concluye?",
o:["Debe repetirse sin IBP","ERGE refractaria accionable","Pirosis funcional sobreagregada","Hipersensibilidad al reflujo"],
c:1,
e:"Con IBP optimizado, <b>TEA &gt; 4 % y &gt; 80 reflujos</b> definen ERGE refractaria accionable: P-CAB, alginato, y evaluar cirugía o terapia endoscópica.",
w:{0:"La ERGE ya está probada: el estudio correcto es con tratamiento.",2:"El TEA está alterado con tratamiento.",3:"La hipersensibilidad exige TEA normal."},
p:"Sin ERGE probada no se habla de «ERGE refractaria» sino de síntomas refractarios.",
r:"Lyon 2.0, Gut 2024"},

{id:"RG05",b:"ES",t:"ERGE y Lyon 2.0",n:"R",md:"E",
q:"Paciente con pirosis que toma omeprazol 20 mg después de almuerzo, cuando se acuerda. ¿Primer paso ante respuesta parcial?",
o:["Cambiar a P-CAB","Tomar el IBP 30–60 min antes del desayuno a diario","Agregar baclofeno","Pedir pH-impedancia"],
c:1,
e:"Los IBP inhiben solo bombas activas: deben tomarse <b>30–60 min antes de la comida</b> y a diario. Optimizar horario y adherencia antes de escalar o estudiar.",
w:{0:"El cambio de fármaco es posterior a optimizar.",2:"El baclofeno no se usa sin ERGE objetiva refractaria.",3:"Estudiar antes de optimizar lleva a falsos «refractarios»."},
p:"Los P-CAB no dependen de la comida ni de la activación de la bomba.",
r:"ACG 2022 ERGE (Katz)"},

{id:"RG06",b:"ES",t:"ERGE y Lyon 2.0",n:"F",md:"E",
q:"¿En qué escenario un P-CAB tiene ventaja demostrada sobre IBP?",
o:["ERGE no erosiva con buena respuesta","Curación de esofagitis grave LA C/D","Pirosis funcional","Prevención de úlcera por AINE en bajo riesgo"],
c:1,
e:"Vonoprazán fue superior a lansoprazol en curación de esofagitis erosiva, con mayor diferencia en <b>LA C/D</b>.",
w:{0:"Si responde a IBP, no hay ventaja que justifique el cambio.",2:"La pirosis funcional no responde a más supresión ácida.",3:"Sin ventaja demostrada en ese escenario."},
p:"En Chile, tegoprazán está disponible desde 2024; vonoprazán y fexuprazán, verificar.",
r:"Laine L et al. Gastroenterology 2023 (PHALCON-EE)"},

{id:"RG07",b:"ES",t:"ERGE y Lyon 2.0",n:"S",md:"X",
q:"Mujer de 44 años con ERGE probada (TEA 9 %), regurgitación como síntoma dominante e IMC 37. ¿Qué cirugía antirreflujo es preferible?",
o:["Fundoplicatura de Nissen","Fundoplicatura parcial de Toupet","Bypass gástrico en Y de Roux","LINX"],
c:2,
e:"Con <b>IMC ≥ 35</b>, la fundoplicatura falla más; el <b>bypass gástrico</b> controla el reflujo y trata la obesidad.",
w:{0:"Mayor tasa de falla y recurrencia en obesidad grave.",1:"Mismo problema que la fundoplicatura completa.",3:"Menos datos en obesidad grave y no trata la obesidad."},
p:"La manga gástrica empeora o induce ERGE: es mala opción en quien ya la tiene.",
r:"ACG 2022 ERGE · SAGES 2021"},

{id:"RG08",b:"ES",t:"ERGE y Lyon 2.0",n:"R",md:"E",
q:"Hombre de 50 años, sin ERGE probada, que responde bien a 8 semanas de IBP. ¿Conducta?",
o:["IBP continuo indefinido","Intentar desescalar a la mínima dosis o a demanda","Endoscopía de control obligatoria","pH-impedancia con IBP"],
c:1,
e:"Sin esofagitis grave, Barrett ni estenosis, se <b>desescala</b> a la dosis mínima eficaz o a demanda.",
w:{0:"El tratamiento indefinido se reserva para LA C/D, Barrett y estenosis.",2:"No hay indicación de control sin hallazgos.",3:"No corresponde con buena respuesta."},
p:"Si no se puede suspender en alguien joven que tomará IBP por años, documentar ERGE con estudio sin tratamiento.",
r:"ACG 2022 ERGE · AGA CPU 2022 desprescripción de IBP"},

/* ===================== Bloque 3 · TICI esofágicos ===================== */
{id:"TE01",b:"ES",t:"TICI esofágicos",n:"R",md:"E",
q:"Pirosis sin respuesta a IBP doble. Endoscopía y biopsias normales; manometría sin trastorno mayor. pH-impedancia sin IBP: TEA 1,5 %, SI 70 %, SAP 98 %. ¿Diagnóstico?",
o:["ERGE no erosiva","Hipersensibilidad al reflujo","Pirosis funcional","ERGE refractaria"],
c:1,
e:"<b>TEA normal con asociación sintomática positiva</b> = hipersensibilidad al reflujo (Roma V).",
w:{0:"Requiere TEA anormal.",2:"La pirosis funcional tiene asociación negativa.",3:"No hay ERGE probada."},
p:"Tratamiento: neuromodulador en dosis baja (ATC, ISRS, pregabalina) ± antisecretor; terapia cerebro-intestino.",
r:"Roma V 2026 (trastornos esofágicos)"},

{id:"TE02",b:"ES",t:"TICI esofágicos",n:"R",md:"X",
q:"En la pirosis funcional, ¿qué tratamiento está contraindicado?",
o:["Amitriptilina en dosis baja","Fundoplicatura","Hipnoterapia dirigida al esófago","Escitalopram"],
c:1,
e:"Sin reflujo patológico ni asociación, la <b>cirugía antirreflujo</b> no mejora y agrega morbilidad.",
w:{0:"Es tratamiento de primera línea.",2:"Tiene evidencia en hipersensibilidad esofágica.",3:"ISRS es alternativa válida."},
p:"Suspender el IBP en la pirosis funcional pura.",
r:"Roma V 2026"},

{id:"TE03",b:"ES",t:"TICI esofágicos",n:"F",md:"E",
q:"¿Cuál de los siguientes es requisito para diagnosticar dolor torácico funcional?",
o:["pH-impedancia con TEA > 6 %","Descartar causa cardíaca y ERGE y trastorno motor mayor","Esofagograma normal solamente","Respuesta a IBP"],
c:1,
e:"Exige exclusión cardíaca, y ausencia de ERGE, EoE y trastorno motor mayor (acalasia, espasmo, hipercontractilidad).",
w:{0:"Eso sería ERGE.",2:"No basta: se requiere manometría y evaluación de reflujo.",3:"La respuesta a IBP sugiere ERGE."},
p:"Neuromoduladores (ATC, ISRS, trazodona) tienen evidencia en dolor torácico no cardíaco.",
r:"Roma V 2026"},

{id:"TE04",b:"ES",t:"TICI esofágicos",n:"R",md:"X",
q:"Mujer de 40 años con sensación de nudo en la garganta, entre comidas, que mejora al comer; sin disfagia ni odinofagia. Examen ORL normal. ¿Diagnóstico más probable?",
o:["Disfagia funcional","Globo","Reflujo laringofaríngeo","Divertículo de Zenker"],
c:1,
e:"Sensación de nudo <b>no dolorosa</b>, entre comidas, que mejora al comer, sin disfagia: <b>globo</b>.",
w:{0:"La disfagia funcional es sensación de paso anormal del bolo.",2:"Diagnóstico sobreutilizado sin evidencia objetiva.",3:"Produce disfagia y regurgitación de alimento no digerido."},
p:"Disfagia, odinofagia, baja de peso o masa cervical obligan a estudio.",
r:"Roma V 2026"},

{id:"TE05",b:"ES",t:"TICI esofágicos",n:"F",md:"E",
q:"Paciente con ronquera y carraspeo crónicos, sin pirosis ni regurgitación, derivado con RSI 22. ¿Siguiente paso más racional?",
o:["IBP doble por 6 meses","pH-impedancia sin tratamiento antes de tratar prolongadamente","Fundoplicatura","Laringoscopía repetida"],
c:1,
e:"El RSI y los hallazgos laríngeos son inespecíficos. Sin síntomas típicos, la prueba empírica rinde poco: <b>documentar reflujo</b> antes de tratamiento prolongado.",
w:{0:"Los ensayos de IBP en reflujo laringofaríngeo sin síntomas típicos son mayormente negativos.",2:"Sin reflujo probado, la cirugía no se justifica.",3:"No agrega a la evaluación del reflujo."},
p:"Con síntomas típicos asociados, una prueba de IBP 2 veces al día por 8–12 semanas es razonable.",
r:"ACG 2022 ERGE · Lyon 2.0"},

{id:"TE06",b:"ES",t:"TICI esofágicos",n:"S",md:"X",
q:"¿Qué proporción aproximada de pacientes derivados por pirosis «refractaria» a IBP tiene ERGE refractaria real?",
o:["≤ 20 %","~50 %","~75 %","> 90 %"],
c:0,
e:"La mayoría de los «refractarios» tiene <b>hipersensibilidad, pirosis funcional, rumiación o eructos</b>; la ERGE refractaria real es minoría.",
w:{1:"Sobreestima.",2:"Sobreestima.",3:"Sobreestima."},
p:"Por eso, sin respuesta a IBP doble: estudiar en vez de escalar.",
r:"Lyon 2.0 · Roma V 2026"},

{id:"TE07",b:"ES",t:"TICI esofágicos",n:"R",md:"E",
q:"Disfagia a sólidos con endoscopía, biopsias, manometría y esofagograma normales. ¿Diagnóstico?",
o:["Acalasia temprana","Disfagia funcional","EoE","EGJOO"],
c:1,
e:"Sensación de paso anormal del bolo sin causa estructural, mucosa (incluida EoE) ni trastorno motor mayor: <b>disfagia funcional</b>.",
w:{0:"La manometría sería anormal o habría que buscar con FLIP si hay sospecha.",2:"Las biopsias son normales.",3:"Requiere IRP elevado."},
p:"Si persiste la sospecha de obstrucción, FLIP puede detectar alteración no vista en manometría.",
r:"Roma V 2026"},

{id:"TE08",b:"ES",t:"TICI esofágicos",n:"F",md:"X",
q:"Paciente con ERGE probada que con IBP queda con pirosis. pH-impedancia con IBP: TEA 0,8 %, 32 reflujos, SAP 97 % con reflujos débilmente ácidos. ¿Conducta?",
o:["Fundoplicatura","Hipersensibilidad sobreagregada: neuromodulador y mantener antisecretor","Duplicar el IBP","Cambiar a P-CAB"],
c:1,
e:"Reflujo controlado (TEA &lt; 1 %, &lt; 40 reflujos) con asociación positiva: <b>hipersensibilidad sobreagregada</b>.",
w:{0:"La cirugía en hipersensibilidad tiene resultados inferiores.",2:"El ácido ya está controlado.",3:"No hay exposición ácida que reducir."},
p:"La superposición de ERGE con TICI esofágico es frecuente.",
r:"Roma V 2026 · Lyon 2.0"},

/* ===================== Bloque 4 · Eructos y rumiación ===================== */
{id:"RU01",b:"ES",t:"Eructos y rumiación",n:"R",md:"E",
q:"Adolescente de 19 años con regurgitación sin esfuerzo de comida reconocible a los pocos minutos de comer, que remastica o escupe; sin náuseas ni arcadas. Bajó 5 kg. ¿Diagnóstico más probable?",
o:["Gastroparesia","Síndrome de rumiación","ERGE grave","Acalasia"],
c:1,
e:"Regurgitación <b>precoz, sin esfuerzo ni náusea</b>, con remasticación: <b>rumiación</b>.",
w:{0:"La gastroparesia produce vómitos tardíos con náusea.",2:"El reflujo no produce regurgitación de comida reconocible y remasticada.",3:"La acalasia produce disfagia y regurgitación de alimento retenido, no remasticado."},
p:"Indagar activamente trastornos de la conducta alimentaria.",
r:"Roma V 2026 · Halland, Clin Gastroenterol Hepatol 2018"},

{id:"RU02",b:"ES",t:"Eructos y rumiación",n:"F",md:"X",
q:"¿Cuál es el estudio de elección para confirmar rumiación?",
o:["Cápsula de pH 96 h","Manometría de alta resolución con impedancia posprandial y comida real","Vaciamiento gástrico","Manometría con degluciones de agua en ayunas"],
c:1,
e:"Se documenta el <b>pico de presión abdominal (onda R) &gt; 30 mmHg</b> que precede al flujo retrógrado, con comida real.",
w:{0:"La cápsula no mide presión ni impedancia.",2:"No discrimina rumiación.",3:"El estudio con agua no reproduce el fenómeno."},
p:"La pH-impedancia sola puede confundir rumiación con reflujo posprandial.",
r:"Roma V 2026"},

{id:"RU03",b:"ES",t:"Eructos y rumiación",n:"R",md:"E",
q:"¿Cuál es el tratamiento de primera línea de la rumiación?",
o:["IBP en dosis doble","Respiración diafragmática durante y después de comer","Fundoplicatura","Metoclopramida"],
c:1,
e:"La <b>respiración diafragmática</b> (idealmente con biorretroalimentación) es incompatible con la contracción abdominal que genera la regurgitación.",
w:{0:"No trata el mecanismo; retirarlo progresivamente.",2:"Contraindicada.",3:"Sin rol."},
p:"Baclofeno si no basta.",
r:"Roma V 2026"},

{id:"RU04",b:"ES",t:"Eructos y rumiación",n:"F",md:"E",
q:"Paciente con eructos muy frecuentes que desaparecen al hablar y al dormir. ¿Mecanismo?",
o:["Aire gástrico que sale por relajación transitoria del esfínter","Aire que entra al esófago y sale de inmediato (supragástrico)","Fermentación bacteriana","Aerofagia por gastroparesia"],
c:1,
e:"El <b>eructo supragástrico</b> es una conducta: aire aspirado o deglutido al esófago que se expulsa en segundos, sin llegar al estómago.",
w:{0:"Es el eructo gástrico fisiológico.",2:"No explica el patrón.",3:"No es el mecanismo."},
p:"Tratamiento: explicación, logopedia, respiración diafragmática, TCC.",
r:"Roma V 2026"},

{id:"RU05",b:"ES",t:"Eructos y rumiación",n:"R",md:"X",
q:"Mujer de 27 años que nunca ha podido eructar, con gorgoteo cervical, distensión y flatulencia excesiva. ¿Tratamiento?",
o:["Simeticona","Toxina botulínica en el cricofaríngeo","IBP","Dieta baja en FODMAP"],
c:1,
e:"<b>Incapacidad para eructar (R-CPD)</b>: el cricofaríngeo no se relaja ante el gas. La <b>toxina botulínica</b> logra respuesta en la gran mayoría.",
w:{0:"Sin efecto en el mecanismo.",2:"No hay reflujo.",3:"Puede reducir gas, no la incapacidad de eructar."},
p:"Diagnóstico nuevo de Roma V en el adulto.",
r:"Bastian RW, Smithson ML. OTO Open 2019 · Roma V 2026"},

{id:"RU06",b:"ES",t:"Eructos y rumiación",n:"S",md:"X",
q:"En la manometría con agua carbonatada de un paciente con R-CPD, ¿qué se espera ver?",
o:["Relajación normal del esfínter superior","Falta de relajación del esfínter superior pese a la presurización esofágica por gas","Acalasia","Peristalsis ausente"],
c:1,
e:"Tras relajarse el esfínter inferior y presurizarse el esófago, el <b>esfínter superior no se relaja</b> e incluso aumenta su presión.",
w:{0:"Es lo que ocurre en sanos.",2:"El esfínter inferior se comporta normal.",3:"La peristalsis suele ser normal."},
p:"Sin provocación, la manometría puede ser normal.",
r:"Roma V 2026"},

{id:"RU07",b:"ES",t:"Eructos y rumiación",n:"F",md:"E",
q:"Paciente «refractario» a IBP con regurgitación posprandial precoz. pH-impedancia: TEA 7 % concentrado en la primera hora posprandial, con muchos reflujos no ácidos. ¿Qué buscar antes de indicar cirugía?",
o:["Gastroparesia","Rumiación","Hernia paraesofágica","EoE"],
c:1,
e:"Un TEA posprandial precoz con reflujos no ácidos puede ser <b>rumiación</b>: el ácido «medido» son los episodios de regurgitación. Una ERGE o esofagitis no excluyen rumiación.",
w:{0:"No produce ese patrón precoz.",2:"No explica el patrón.",3:"No produce reflujo medible."},
p:"Operar a un rumiador empeora los síntomas.",
r:"Roma V 2026 · Lyon 2.0"},

{id:"RU08",b:"ES",t:"Eructos y rumiación",n:"R",md:"E",
q:"¿Qué distingue la rumiación del vómito?",
o:["El contenido es ácido","Ausencia de náusea y arcadas, y esfuerzo mínimo","Aparece horas después de comer","Siempre hay baja de peso"],
c:1,
e:"La rumiación es <b>sin esfuerzo y sin náusea ni arcadas</b>, a los pocos minutos de comer.",
w:{0:"El contenido sabe a la comida, no a ácido.",2:"Es precoz.",3:"Puede o no haber baja de peso."},
p:"Roma V excluye rumiación antes de diagnosticar síndromes de náuseas y vómitos.",
r:"Roma V 2026"},

/* ===================== Bloque 5 · Disfagia y EoE ===================== */
{id:"EO01",b:"ES",t:"Disfagia y EoE",n:"R",md:"E",
q:"Hombre de 24 años con impactación alimentaria. Endoscopía: anillos y surcos. ¿Protocolo de biopsias?",
o:["2 biopsias distales","≥ 6 biopsias de 2 niveles (proximal o medio y distal)","Solo si la mucosa es anormal","Biopsias gástricas y duodenales solamente"],
c:1,
e:"Para EoE: <b>≥ 6 biopsias</b> de al menos 2 niveles, aun con mucosa normal.",
w:{0:"Insuficiente sensibilidad.",2:"La mucosa puede ser normal en EoE.",3:"Se agregan si hay sospecha de gastroenteritis eosinofílica."},
p:"Impactación en adulto joven: EoE hasta demostrar lo contrario.",
r:"AGA-JTF 2020 EoE · Dellon, Gastroenterology 2018 (AGREE)"},

{id:"EO02",b:"ES",t:"Disfagia y EoE",n:"R",md:"X",
q:"¿Cuál es el umbral histológico de EoE?",
o:["≥ 6 eosinófilos/campo","≥ 15 eosinófilos/campo de alto aumento","≥ 20 linfocitos/100 células","≥ 50 eosinófilos/mm²"],
c:1,
e:"Síntomas de disfunción esofágica + <b>≥ 15 eosinófilos/campo de alto aumento</b>, excluyendo otras causas.",
w:{0:"Umbral demasiado bajo.",2:"Corresponde a colitis linfocítica.",3:"No es el criterio estándar."},
p:"La respuesta al IBP ya no excluye EoE.",
r:"AGREE 2018 · AGA-JTF 2020"},

{id:"EO03",b:"ES",t:"Disfagia y EoE",n:"F",md:"E",
q:"Paciente con EoE que responde histológicamente a omeprazol 40 mg c/12 h. ¿Cómo se clasifica?",
o:["Eosinofilia esofágica respondedora a IBP, entidad distinta","EoE respondedora a IBP","ERGE","EoE refractaria"],
c:1,
e:"Desde AGREE 2018 la antigua «PPI-REE» se considera <b>EoE que responde a IBP</b>.",
w:{0:"Término abandonado.",2:"No se reclasifica como ERGE.",3:"Respondió."},
p:"El IBP es tratamiento de primera línea junto a corticoide tópico y dieta.",
r:"Dellon, Gastroenterology 2018 (AGREE)"},

{id:"EO04",b:"ES",t:"Disfagia y EoE",n:"F",md:"X",
q:"¿Qué tratamiento biológico está aprobado para EoE?",
o:["Vedolizumab","Dupilumab","Omalizumab","Mepolizumab"],
c:1,
e:"<b>Dupilumab</b> (anti-receptor α de IL-4) 300 mg semanal mejoró histología y disfagia.",
w:{0:"Sin rol en EoE.",2:"Ensayos negativos.",3:"Resultados histológicos sin mejoría clínica consistente."},
p:"Útil en refractarios o con atopia grave asociada.",
r:"Dellon ES et al. NEJM 2022;387:2317-30"},

{id:"EO05",b:"ES",t:"Disfagia y EoE",n:"R",md:"E",
q:"¿Cuánto tiempo debe suspenderse el IBP antes de una endoscopía diagnóstica de EoE?",
o:["48 h","1 semana","≥ 3 semanas","No es necesario"],
c:2,
e:"El IBP, el corticoide tópico y la dieta pueden enmascarar la eosinofilia: suspender <b>≥ 3 semanas</b>.",
w:{0:"Insuficiente.",1:"Insuficiente.",3:"Puede producir falso negativo."},
p:"Para ERGE, la endoscopía sin IBP requiere 2–4 semanas.",
r:"AGA-JTF 2020"},

{id:"EO06",b:"ES",t:"Disfagia y EoE",n:"R",md:"X",
q:"Disfagia a sólidos y líquidos desde el inicio, con regurgitación de comida no digerida. ¿Mecanismo más probable?",
o:["Estenosis péptica","Trastorno motor","Anillo de Schatzki","Cáncer esofágico"],
c:1,
e:"Disfagia a <b>sólidos y líquidos desde el inicio</b> sugiere trastorno motor (acalasia).",
w:{0:"Produce disfagia progresiva a sólidos.",2:"Disfagia intermitente a sólidos.",3:"Disfagia progresiva a sólidos y luego líquidos, con baja de peso."},
p:"Orofaríngea (tos, voz húmeda, regurgitación nasal) se estudia con videofluoroscopía.",
r:"ACG 2020 acalasia"},

{id:"EO07",b:"ES",t:"Disfagia y EoE",n:"F",md:"E",

<script>
(function(){
"use strict";
const SNAP="<!doctype html>\n"+document.documentElement.outerHTML;
const ALL=[...Q1,...Q2,...Q3,...Q4].map(q=>({...q,mode:q.md||"E",m:q.m||""}));
const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));
const BL={ES:"Roma V y esófago",GD:"Estómago",IN:"Intestino",AR:"Anorrectal, dolor y laboratorio"};
const BS={ES:"Esófago",GD:"Estómago",IN:"Intestino",AR:"Anorrectal · dolor"};
const BSEG=[["all","Todos"],["ES","Esófago"],["GD","Estómago"],["IN","Intestino"],["AR","Anorrectal·dolor"]];
const NV={R:"Residente",F:"Fellow",S:"Staff"};
const LET="ABCDE";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- almacenamiento: este navegador + nube (Google Sheets) ---------- */
const KEY="quizNeuro_2026";
const CLOUD_DEF={api:"https://script.google.com/macros/s/AKfycbx2ZaMKlpOflSCSYZBb7h4iQk9DyzF7LG0y-DAT-o76syavAQLuDojJoMRB8tUnrFDdkQ/exec",token:"neuro-2026"};
const CLOUD=(()=>{let o={};try{o=JSON.parse(localStorage.getItem("quizNeuro_cloud")||"{}")}catch(e){}
  const api=o.api||CLOUD_DEF.api, tk=o.token||CLOUD_DEF.token;return {api:api.startsWith("http")?api:"",tokens:[tk],token:tk,id:"quizNeuro_2026"}})();
let tokenReady=null;         // se resuelve cuando se sabe qué clave acepta el script
let booting=true;            // durante la carga no se marca cambio ni se envía a la nube
const LOG=[];                // respuestas pendientes de enviar a la hoja "respuestas"
let pushTimer=null,dirty=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function writeLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function save(){
  if(!booting){DB._t=Date.now();dirty=true;clearTimeout(pushTimer);pushTimer=setTimeout(pushCloud,1500);}
  writeLocal();
}
function setSync(st,txt){const el=document.getElementById("syncState");if(!el)return;el.className="sync "+st;el.textContent=txt;el.title=st==="err"?"Motivo: "+syncWhy:"Estado de guardado";
  const p=document.getElementById("syncNote");if(p)p.textContent=syncNote();}
let lastSync=null,syncErr=false,syncWhy="";
function syncNote(){if(!CLOUD.api)return "Sin conexión configurada con Google Sheets: el progreso se guarda solo en este navegador. Pegue abajo la URL del Apps Script para sincronizar entre dispositivos.";return syncErr?`Sin conexión con la nube (${syncWhy||"error desconocido"}): el progreso queda en este navegador y se sincroniza al volver la conexión.`:lastSync?`Progreso sincronizado con Google Sheets (${lastSync.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})}): lo retomas desde cualquier dispositivo.`:"Conectando con la nube…"}
async function readJSON(r){const t=await r.text();try{return JSON.parse(t)}catch(e){
  const m=t.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,140);throw new Error("Google respondió una página en vez de datos: "+m)}}
async function resolveToken(){
  for(const t of CLOUD.tokens){
    const r=await fetch(`${CLOUD.api}?action=load&quizId=${encodeURIComponent(CLOUD.id)}&token=${encodeURIComponent(t)}`);
    const d=await readJSON(r);
    if(d.ok){CLOUD.token=t;return d;}
    if(d.error!=="token inválido")throw new Error(d.error);
  }
  throw new Error("token inválido (la clave del script no coincide con la del quiz)");
}
async function pushCloud(){
  clearTimeout(pushTimer);pushTimer=null;
  if(!CLOUD.api){dirty=false;LOG.length=0;return;}
  if(tokenReady)try{await tokenReady}catch(e){}
  if(!dirty&&!LOG.length)return;
  const lote=LOG.splice(0);dirty=false;
  try{
    const r=await fetch(CLOUD.api,{method:"POST",body:JSON.stringify({token:CLOUD.token,action:"save",quizId:CLOUD.id,estado:DB,respuestas:lote})});
    const d=await readJSON(r);if(!d.ok)throw new Error(d.error);
    lastSync=new Date();syncErr=false;setSync("ok","☁ guardado");
  }catch(e){LOG.unshift(...lote);dirty=true;syncErr=true;syncWhy=e.message||String(e);setSync("err","● sin conexión");}
}
addEventListener("pagehide",()=>{
  if(!CLOUD.api||(!dirty&&!LOG.length))return;
  try{navigator.sendBeacon(CLOUD.api,new Blob([JSON.stringify({token:CLOUD.token,action:"save",quizId:CLOUD.id,estado:DB,respuestas:LOG.splice(0)})],{type:"text/plain"}));dirty=false}catch(e){}
});
addEventListener("online",()=>{if(dirty||LOG.length)pushCloud()});
const DB=load(); DB.q=DB.q||{}; DB.exams=DB.exams||[];
function record(id,ok,chosen){const r=DB.q[id]||{n:0,ok:0};r.n++;if(ok)r.ok++;r.last=ok?1:0;DB.q[id]=r;
  const q=byId[id];if(q)LOG.push({preguntaId:id,tema:`${q.b} · ${q.t}`,elegida:chosen==null?"":chosen,correcta:q.c,fecha:new Date().toISOString()});
  save()}

/* ---------- tema ---------- */
$("#themeBtn").addEventListener("click",()=>{
  const root=document.documentElement;
  const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";root.setAttribute("data-theme",next);DB.theme=next;save();
});
if(DB.theme)document.documentElement.setAttribute("data-theme",DB.theme);

/* ---------- pestañas ---------- */
const tabs=[...document.querySelectorAll(".tabs button")];
function showTab(t){tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!=="tab-"+t);
  DB.tab=t;save(); if(t==="stats")renderStats(); if(t==="flash")renderFlash(); if(t==="changes")renderChanges();}
tabs.forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
$("#nStudy").textContent=ALL.filter(q=>q.mode==="E").length;
$("#nExam").textContent=ALL.filter(q=>q.mode==="X").length;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function segHTML(name,opts,val){return `<div class="seg" data-seg="${name}">`+opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join("")+`</div>`}
function bindSeg(root,name,cb){root.querySelectorAll(`[data-seg="${name}"] button`).forEach(b=>b.addEventListener("click",()=>cb(b.dataset.v)))}
function chips(q){return `<span class="chip b-${q.b}">${BS[q.b]}</span><span class="chip lv-${q.n}">${NV[q.n]}</span><span class="chip">${esc(q.t)}</span>`+(q.fix?`<span class="chip fix">corrige v5</span>`:"")+(q.nuevo?`<span class="chip new">actualización</span>`:"")}
function explainHTML(q,order,chosen){
  const ok=chosen===q.c;
  const wrongs=order.map((oi,pos)=>oi===q.c?"":`<li><b class="L">${LET[pos]}</b>${q.w[oi]}</li>`).join("");
  return `<div class="explain">
    ${chosen==null?`<div class="verdict bad">Sin responder</div>`:`<div class="verdict ${ok?"ok":"bad"}">${ok?"Correcto.":"Incorrecto."} Respuesta: ${LET[order.indexOf(q.c)]}</div>`}
    <div class="blk"><h4>Explicación</h4><p>${q.e}</p></div>
    <div class="blk"><h4>Por qué no las otras</h4><ul>${wrongs}</ul></div>
    ${q.m?`<div class="blk mech"><h4>Mecanismo / fisiopatología</h4><p>${q.m}</p></div>`:""}
    <div class="blk pearl"><h4>Perla</h4><p>${q.p}</p></div>
    ${q.nuevo?`<div class="blk newbox"><h4>Qué cambió</h4><p>${q.nuevo}</p></div>`:""}
    ${q.fix?`<div class="blk fixbox"><h4>Corrección respecto de v5 / otras herramientas</h4><p>${q.fix}</p></div>`:""}
    <div class="blk refs"><h4>Referencias</h4><p>${q.r}</p></div>
  </div>`;
}
function themes(list){return [...new Set(list.map(q=>q.t))].sort((a,b)=>a.localeCompare(b,"es"))}

/* ================= ESTUDIO ================= */
const ST_DEF=()=>({bank:"E",b:"all",n:"all",t:"all",failed:false,i:0,orders:{},ans:{}});
const ST=ST_DEF();
function restoreST(){const d=ST_DEF();Object.keys(ST).forEach(k=>delete ST[k]);Object.assign(ST,d,DB.st||{});ST.orders=ST.orders||{};ST.ans=ST.ans||{};}
restoreST();
function studyList(){return ALL.filter(q=>(ST.bank==="all"||q.mode==="E")&&(ST.b==="all"||q.b===ST.b)&&(ST.n==="all"||q.n===ST.n)&&(ST.t==="all"||q.t===ST.t)&&(!ST.failed||(DB.q[q.id]&&DB.q[q.id].last===0)))}
function renderStudy(){
  const root=$("#tab-study");const list=studyList();
  if(ST.i>=list.length)ST.i=Math.max(0,list.length-1);
  const pool=ALL.filter(q=>ST.bank==="all"||q.mode==="E");
  let h=`<div class="filters">
    <span><span class="flabel">Banco</span>${segHTML("bank",[["E",`Estudio (${ALL.filter(q=>q.mode==="E").length})`],["all",`Todo (${ALL.length})`]],ST.bank)}</span>
    <span><span class="flabel">Bloque</span>${segHTML("b",BSEG,ST.b)}</span>
    <span><span class="flabel">Nivel</span>${segHTML("n",[["all","Todos"],["R","Residente"],["F","Fellow"],["S","Staff"]],ST.n)}</span>
    <span><label class="flabel" for="stTema">Tema</label><select id="stTema"><option value="all">Todos</option>${themes(pool).map(t=>`<option ${t===ST.t?"selected":""}>${esc(t)}</option>`).join("")}</select></span>
    <span>${segHTML("failed",[["0","Todas"],["1","Solo falladas"]],ST.failed?"1":"0")}</span>
  </div>`;
  if(!list.length){root.innerHTML=h+`<div class="card empty">No hay preguntas con estos filtros${ST.failed?" (aún no registras preguntas falladas)":""}.</div>`;bindStudy(root);persistST();return;}

function examPool(){return ALL.filter(q=>q.mode==="X"&&(EX.b==="all"||q.b===EX.b)&&(EX.n==="all"||q.n===EX.n))}
function persistEX(){

}
function restoreEX(){

      <div class="sub" style="max-width:40ch">${pct>=80?"Nivel sólido. Revisa igual las explicaciones de las correctas por azar.":pct>=60?"Base adecuada; enfócate en los bloques bajo 70%.":"Conviene repasar en modo estudio los temas con más errores."}</div></div>

    $("#exNew").addEventListener("click",()=>{EX.state="setup";renderExam()});

function startExam(pool){
  const n=EX.count==="all"?pool.length:Math.min(pool.length,+EX.count);
  EX.qs=pool.slice(0,n);EX.orders={};EX.ans={};EX.i=0;EX.confirm=false;
  EX.qs.forEach(q=>EX.orders[q.id]=shuffle(q.o.map((_,i)=>i)));

function updTimer(){
  const el=$("#exTimer");if(!EX.limit||EX.state!=="run")return;

}
function finishExam(){
  clearInterval(EX.tick);EX.state="done";
  EX.qs.forEach(q=>{if(EX.ans[q.id]!==undefined)record(q.id,EX.ans[q.id]===q.c,EX.ans[q.id])});

  DB.exams.push({d:Date.now(),n:EX.qs.length,ok});if(DB.exams.length>30)DB.exams.shift();save();

}

  const o=q.o.map((_,i)=>i);for(let i=o.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;const j=h%(i+1);[o[i],o[j]]=[o[j],o[i]]}return o}
function bankRows(list){return list.map(q=>{const or=seededOrder(q);const L=oi=>LET[or.indexOf(+oi)];return {id:q.id,modo:q.mode==="E"?"Estudio":"Examen",bloque:BL[q.b],nivel:NV[q.n],tema:q.t,pregunta:plain(q.q),opciones:or.map(i=>plain(q.o[i])),correcta:L(q.c),respuesta:plain(q.o[q.c]),explicacion:plain(q.e),porQueNo:Object.keys(q.w).sort((x,y)=>or.indexOf(+x)-or.indexOf(+y)).map(k=>L(k)+": "+plain(q.w[k])).join(" | "),mecanismo:plain(q.m||""),perla:plain(q.p),cambio:plain(q.nuevo||""),correccionV5:plain(q.fix||""),referencias:plain(q.r)}})}
function exportCSV(list){const R=bankRows(list);const H=["id","modo","bloque","nivel","tema","pregunta","A","B","C","D","correcta","respuesta","explicacion","porQueNo","mecanismo","perla","cambio","correccionV5","referencias"];

function exportAnki(list){const t=s=>String(s).replace(/\t/g," ").replace(/\n/g,"<br>");

    const back=`<b>${LET[or.indexOf(q.c)]}) ${q.o[q.c]}</b><br><br>${q.e}<br><br><i>Perla:</i> ${q.p}`+(q.m?`<br><br><i>Mecanismo:</i> ${q.m}`:"")+`<br><br><small>${q.r}</small>`;
    return [t(front),t(back),["Neurogastro",q.b,NV[q.n],q.mode==="E"?"estudio":"examen",q.t.replace(/\s+/g,"_")].join(" ")].join("\t")}).join("\n")}

    const legacy=()=>{ta.select();try{document.execCommand("copy");done()}catch(e){}};
    if(navigator.clipboard)navigator.clipboard.writeText(content).then(done).catch(legacy);else legacy();});}
function deliver(name,content,mime){
  const out=$("#expOut");
  if(!EMBED){try{const b=new Blob([content],{type:mime+";charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);out.innerHTML=`<p class="muted">Descargado: <b>${esc(name)}</b></p>`;return}catch(e){}}

    DL.save({filename:name,data:content}).then(r=>{out.innerHTML=`<p class="muted">${r&&r.status==="delivered"?"Enviado":"Descargado"}: <b>${esc(name)}</b></p>`})
      .catch(e=>{const c=e&&e.code;if(c==="declined")out.innerHTML=`<p class="muted">Descarga cancelada.</p>`;else if(c==="rate_limited")out.innerHTML=`<p class="muted">Ya hay un aviso de descarga abierto; intenta de nuevo en unos segundos.</p>`;else copyFallback(name,content,"No se pudo descargar en esta vista.")});return}
  copyFallback(name,content);
}
